# cargo-deny configuration — supply-chain controls for Legion Runner.
# Run locally with: cargo deny check advisories bans sources

[advisories]
version = 2
# Fail on crates pulled from a source that has yanked the exact version.
yanked = "deny"
ignore = []

[bans]
# Duplicate transitive versions are a warning (useful signal, too noisy to fail
# routine updates on). Wildcard version requirements are DENIED: we pin every
# dependency through Cargo.lock and never use "*", so a wildcard slipping in
# (which would silently pull whatever a registry serves) fails the build.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
# Only allow dependencies from crates.io; reject unknown registries / git deps
# to prevent dependency-confusion and unvetted source pulls (OWASP A08).
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
