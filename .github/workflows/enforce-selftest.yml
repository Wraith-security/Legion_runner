name: Enforce self-test

# Deterministic proof that block-mode enforcement works: an inline allowlist
# permits example.com (seeded from its resolved IPs) while an unlisted host
# (wikipedia) is denied. Uses the inline path (no auto-learn) so it's reliable
# regardless of how names resolve. The auto-learn + eBPF capture round-trip is
# exercised separately in ebpf-agent.yml.

on:
  # PR gate ONLY. Deliberately no `push:` trigger: a self-test does not need to
  # re-run on main after a merge (the PR already validated it), and re-running it
  # on main just spins/wastes minutes. Docs-only changes (Markdown / LICENSE /
  # docs/) are skipped because they can't affect enforcement; docs-passthrough.yml
  # reports this check green for those PRs so the required gate stays satisfied
  # and they remain mergeable.
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this self-test only reads the repo.
permissions:
  contents: read

jobs:
  enforce:
    name: Block allows allowlisted, denies the rest
    runs-on: ubuntu-latest
    timeout-minutes: 10   # hard cap so a stuck job can't run to the 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Harden (block) with an inline allowlist
        # Tests THIS repo's enforcement code (not the published action) — that's
        # the point of the self-test. Consumers reference the Marketplace @v1.
        uses: ./
        with:
          egress-policy: block
          allowed-endpoints: |
            example.com
          dns-capture: 'false'        # exercise the static-seed enforcement path
          job-summary: 'false'        # self-test, not a report: keep it out of the summary
          ebpf: 'off'                 # this test is about the firewall, not
                                      # capture — no agent to spawn/clean up
          learned-baseline: 'false'   # inline allowlist ONLY — ignore the shared
                                      # Actions-cache baseline so the deny case is
                                      # deterministic (not polluted by other runs)

      - name: Allowlisted host allowed, unlisted host denied
        run: |
          set +e
          curl -sS --max-time 25 -o /dev/null https://example.com;        learned=$?
          curl -sS --max-time 25 -o /dev/null https://www.wikipedia.org;  unlearned=$?
          echo "example.com (allowlisted) exit=$learned   (expect 0 = allowed)"
          echo "wikipedia   (not listed)  exit=$unlearned (expect non-zero = denied)"
          if [ "$learned" -eq 0 ] && [ "$unlearned" -ne 0 ]; then
            echo "PASS — block enforcement verified (allow + deny)."
          else
            echo "FAIL — allow/deny did not match expectations."
            exit 1
          fi

  # Reliability gate: run the FULL block path — firewall + DNS-capture forwarder
  # (dynamic allow-by-domain) + eBPF agent + the firewall/daemon teardown — and
  # prove the job FINALIZES. If any daemon leaks or the firewall isn't torn down,
  # the runner hangs at teardown and this job hits the timeout and fails. This is
  # the guard for the whole class of teardown-hang bugs.
  full-stack:
    name: Block + dns-capture + eBPF finalizes (no teardown hang)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Harden (block) with all daemons on
        uses: ./
        with:
          egress-policy: block
          allowed-presets: cargo        # exercise the curated-preset allowlist path
          allowed-endpoints: |
            example.com
          dns-capture: 'true'           # DNS forwarder + dynamic allow + its teardown
          job-summary: 'false'          # self-test, not a report: keep it out of the summary
          ebpf: 'auto'                  # agent path (fail-closed download → /proc)
          learned-baseline: 'false'

      - name: Allowlisted host reachable via dynamic allow-by-domain
        run: |
          set -e
          curl -sS --max-time 25 -o /dev/null https://example.com
          echo "example.com reachable under block + dns-capture — dynamic allow works."
          # The decisive assertion is implicit: the post step tears down the
          # firewall + every daemon; if it doesn't, this job times out.

  # H1: in block mode no job step may use DNS to reach anything off the
  # allowlist. Every non-root query is redirected to the forwarder, names off
  # the allowlist are REFUSED, and a resolved restart (what Docker interface
  # changes trigger) must not knock out allow-by-domain.
  dns-lockdown:
    name: Block refuses DNS off the allowlist, whatever resolver is asked
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Make sure dig is present (before the firewall goes up)
        run: command -v dig || (sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils)
      - name: Harden (block) with DNS capture
        uses: ./
        with:
          egress-policy: block
          allowed-endpoints: |
            example.com
          dns-capture: 'true'
          job-summary: 'false'
          ebpf: 'off'
          learned-baseline: 'false'
      - name: Unlisted names are refused, even asked of an outside resolver
        run: |
          set -u
          fail=0
          out="$(dig +time=5 +tries=1 @1.1.1.1 "exfil-${RANDOM}.example.net" A 2>&1 || true)"
          echo "$out" | grep -q 'status: REFUSED' || { echo "FAIL: unlisted name not refused via 1.1.1.1"; echo "$out"; fail=1; }
          out="$(dig +time=5 +tries=1 "exfil-${RANDOM}.example.net" A 2>&1 || true)"
          echo "$out" | grep -q 'status: REFUSED' || { echo "FAIL: unlisted name not refused via the system resolver"; echo "$out"; fail=1; }
          if dig +tcp +time=5 +tries=1 @1.1.1.1 example.com A >/dev/null 2>&1 && \
             dig +tcp +short +time=5 +tries=1 @1.1.1.1 example.com A | grep -q .; then
            echo "FAIL: TCP DNS to an outside resolver got through"; fail=1
          fi
          dig +short +time=5 +tries=1 @1.1.1.1 example.com A | grep -qE '^[0-9.]+$' \
            || { echo "FAIL: allowlisted name did not resolve"; fail=1; }
          exit "$fail"
      - name: Allow-by-domain survives a systemd-resolved restart
        run: |
          set -e
          sudo systemctl restart systemd-resolved
          sleep 2
          curl -sS --max-time 25 -o /dev/null https://example.com
          if curl -sS --max-time 15 -o /dev/null https://www.wikipedia.org; then
            echo "FAIL: unlisted host reachable"; exit 1
          fi
          echo "PASS: allowlisted host reachable after the restart, unlisted host still denied"

  # H5: containers. Their traffic is forwarded and never passed OUTPUT, so it
  # used to bypass block mode entirely.
  containers:
    name: Block applies to containers too
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Pull the test image (before the firewall goes up)
        run: docker pull -q alpine:3.20
      - name: Harden (block)
        uses: ./
        with:
          egress-policy: block
          allowed-endpoints: |
            example.com
          dns-capture: 'true'
          job-summary: 'false'
          ebpf: 'off'
          learned-baseline: 'false'
      - name: A container reaches the allowlist and nothing else
        run: |
          set -u
          docker run --rm alpine:3.20 wget -q -T 20 -O /dev/null https://example.com \
            || { echo "FAIL: container could not reach the allowlisted host"; exit 1; }
          if docker run --rm alpine:3.20 wget -q -T 15 -O /dev/null https://www.wikipedia.org; then
            echo "FAIL: container reached an unlisted host (block mode bypassed)"; exit 1
          fi
          echo "PASS: container egress is filtered like the host's"

  # H2 and H4: with disable-sudo the job really loses sudo, cannot read or edit
  # Legion's evidence, block mode stays up, and the job still finalizes (the
  # warden tears down when Runner.Worker exits; a hang hits the timeout).
  sudo-revoked:
    name: disable-sudo revokes sudo and the job still finalizes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Harden (block, disable-sudo)
        uses: ./
        with:
          egress-policy: block
          allowed-endpoints: |
            example.com
          dns-capture: 'true'
          disable-sudo: 'true'
          job-summary: 'false'
          ebpf: 'off'
          learned-baseline: 'false'
      - name: No sudo, no evidence access, block still enforced
        run: |
          set -u
          fail=0
          if sudo -n true 2>/dev/null; then echo "FAIL: sudo still works"; fail=1; fi
          if sudo -n iptables -F 2>/dev/null; then echo "FAIL: could flush the firewall"; fail=1; fi
          if ls /run/legion >/dev/null 2>&1; then echo "FAIL: evidence dir is listable"; fail=1; fi
          if echo x 2>/dev/null >> /run/legion/state.json; then echo "FAIL: evidence is writable"; fail=1; fi
          curl -sS --max-time 25 -o /dev/null https://example.com || { echo "FAIL: allowlisted host blocked"; fail=1; }
          if curl -sS --max-time 15 -o /dev/null https://www.wikipedia.org; then echo "FAIL: unlisted host reachable"; fail=1; fi
          exit "$fail"
