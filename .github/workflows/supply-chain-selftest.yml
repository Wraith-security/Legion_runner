name: Supply-chain selftest

# Proves a full crates.io build succeeds under Legion's default-deny egress
# firewall (block mode). This is the runtime half of supply-chain defense:
# cargo-deny / cargo-audit catch KNOWN-bad advisories, while block mode stops an
# UNKNOWN-bad build.rs or proc-macro from exfiltrating at build time, even a
# zero-day the advisory databases have not seen yet.
#
# Deliberately its OWN workflow and NOT part of the release-gating CI: a missing
# allowlist entry should surface here and name the host, not block a release.
# Once the allowlist is proven stable, promote this into CI (or flip the rust
# job's egress-policy to block) to gate on it.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  locked-build:
    name: Build under default-deny egress (block)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the toolchain and warm the cache BEFORE the firewall goes up.
      # Rustup fetches the toolchain from rust-lang.org; that is trusted setup,
      # not the thing under test. We firewall the dependency BUILD (below), which
      # is where a malicious build.rs / proc-macro would try to phone home.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-block-${{ hashFiles('**/Cargo.lock') }}

      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.58   # dogfood our own action (enforce)
        with:
          egress-policy: block
          # Curated per-ecosystem allowlists for the dependency fetch/build.
          allowed-presets: cargo, rust, apt
          # Proven build endpoints (mirrors the seed in ci.yml's rust job), so a
          # preset gap does not fail the run on day one.
          allowed-endpoints: |
            static.rust-lang.org
            index.crates.io
            static.crates.io
            crates.io
            actions.githubusercontent.com
            blob.core.windows.net
          ebpf: auto
          dns-capture: true

      - name: Build the full crate tree under block mode
        # This is the step that matters: dependencies are fetched and compiled
        # with egress default-denied, so anything a dependency tries to reach
        # beyond the allowlist is dropped and named in the Legion job summary.
        # If it fails on a blocked destination, add that host above.
        run: cargo build --release --workspace
