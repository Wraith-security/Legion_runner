name: CI

on:
  # PRs are validated via pull_request; push only runs on the protected branches
  # themselves. Previously push: ['**'] AND pull_request both fired on every
  # PR-branch commit, doubling every run. Now each commit runs CI once.
  #
  # Docs-only changes (Markdown / LICENSE / docs/) are ignored: they can't break
  # the build or the action, so CI (and the release it gates) is skipped. The
  # docs-passthrough workflow reports the same check names green so required
  # checks stay satisfied and docs PRs remain mergeable.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job only reads the repo. No job needs to write contents,
# move tags, or edit releases, so the default token is narrowed to read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Every job hardens with our own action in BLOCK mode (default-deny egress): the
# only outbound hosts allowed are GitHub/Actions (allow-github), the per-job
# allowed-presets (cargo/rust/apt), and the committed allowlist in
# .legion/egress-allowed.txt. Anything else a build step reaches is dropped at
# the firewall and named in that job's Legion summary. Each job suppresses its
# per-job summary (job-summary: false), emits its captured egress as an artifact,
# and the final `egress-report` job merges them into a SINGLE run-level summary
# (which job/process reached what, plus per-job diagnostics).
jobs:
  rust:
    name: Rust test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 20   # hard cap: never let a hung job run to the 6h default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.61   # Marketplace action
        with:
          # Default-deny egress: a malicious build.rs / proc-macro that tries to
          # phone home during fmt/clippy/test/build is dropped and named. The
          # allowlist is the cargo+rust presets plus .legion/egress-allowed.txt.
          egress-policy: block
          allowed-presets: cargo, rust
          policy-file: .legion/egress-allowed.txt
          ebpf: 'auto'
          dns-capture: 'true'
          job-summary: 'false'   # combined into the egress-report job

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build (release)
        run: cargo build --release -p legionr-cli

      - name: Legion egress report (emit)
        if: always()
        run: node "$GITHUB_WORKSPACE/action/report.js" emit "$RUNNER_TEMP/legion-report.json"
      - name: Upload egress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legion-egress-${{ github.job }}
          path: ${{ runner.temp }}/legion-report.json
          if-no-files-found: ignore
          retention-days: 1

  action:
    name: Action unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.61   # dogfood our own action
        with:
          egress-policy: block
          # No package install here (pure Node built-ins); setup-node fetches the
          # runtime from nodejs.org, which is in the allowlist file.
          policy-file: .legion/egress-allowed.txt
          ebpf: 'auto'
          dns-capture: 'true'
          job-summary: 'false'   # combined into the egress-report job

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.node-version'

      - name: Syntax check
        run: |
          for f in action/*.js; do node --check "$f"; done

      - name: Unit + regression tests (node:test)
        run: node --test action/*.test.js

      - name: Legion egress report (emit)
        if: always()
        run: node "$GITHUB_WORKSPACE/action/report.js" emit "$RUNNER_TEMP/legion-report.json"
      - name: Upload egress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legion-egress-${{ github.job }}
          path: ${{ runner.temp }}/legion-report.json
          if-no-files-found: ignore
          retention-days: 1

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.61   # dogfood our own action
        with:
          egress-policy: block
          allowed-presets: apt
          policy-file: .legion/egress-allowed.txt
          ebpf: 'auto'
          dns-capture: 'true'
          job-summary: 'false'   # combined into the egress-report job
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

      - name: Legion egress report (emit)
        if: always()
        run: node "$GITHUB_WORKSPACE/action/report.js" emit "$RUNNER_TEMP/legion-report.json"
      - name: Upload egress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legion-egress-${{ github.job }}
          path: ${{ runner.temp }}/legion-report.json
          if-no-files-found: ignore
          retention-days: 1

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.61   # dogfood our own action
        with:
          egress-policy: block
          allowed-presets: cargo, rust
          policy-file: .legion/egress-allowed.txt
          ebpf: 'auto'
          dns-capture: 'true'
          job-summary: 'false'   # combined into the egress-report job
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      # Install a prebuilt cargo-audit binary instead of `cargo install` (which
      # compiles it and pulls its whole dependency tree from crates.io, where one
      # flaky download fails the job, as it did with a transient TLS EOF).
      - name: Install cargo-audit (prebuilt)
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit

      - name: Legion egress report (emit)
        if: always()
        run: node "$GITHUB_WORKSPACE/action/report.js" emit "$RUNNER_TEMP/legion-report.json"
      - name: Upload egress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legion-egress-${{ github.job }}
          path: ${{ runner.temp }}/legion-report.json
          if-no-files-found: ignore
          retention-days: 1

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Harden runner (Legion, BLOCK)
        uses: Wraith-security/legion_runner@v1.0.61   # dogfood our own action
        with:
          egress-policy: block
          allowed-presets: cargo
          policy-file: .legion/egress-allowed.txt
          ebpf: 'auto'
          dns-capture: 'true'
          job-summary: 'false'   # combined into the egress-report job
      - name: cargo-deny (advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans sources

      - name: Legion egress report (emit)
        if: always()
        run: node "$GITHUB_WORKSPACE/action/report.js" emit "$RUNNER_TEMP/legion-report.json"
      - name: Upload egress report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legion-egress-${{ github.job }}
          path: ${{ runner.temp }}/legion-report.json
          if-no-files-found: ignore
          retention-days: 1

  # One summary for the whole run: merge every job's egress artifact into a single
  # table (which job/process reached what) with a per-job diagnostics block.
  egress-report:
    name: Combined egress report
    needs: [rust, action, shellcheck, security, supply-chain]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download per-job egress reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: legion-egress-*
          path: legion-reports
      - name: Render combined summary (all jobs)
        run: node action/report.js render legion-reports >> "$GITHUB_STEP_SUMMARY"
